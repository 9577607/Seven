<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI增长执行官</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#2848c7,#6985ff);color:#fff;padding:28px;border-radius:22px}.hero h1{margin:0 0 8px}.card{background:#fff;margin-top:16px;padding:22px;border-radius:18px;box-shadow:0 10px 30px #1d326512}.steps{display:flex;gap:8px;overflow:auto;margin:0 0 18px}.step{white-space:nowrap;padding:8px 12px;border-radius:999px;background:#eef1f6;color:#667085}.step.on{background:#375dfb;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;font:inherit}textarea{min-height:80px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.opt{padding:14px;border:1px solid #dfe4ec;border-radius:12px;cursor:pointer}.opt.on{border-color:#375dfb;background:#eef2ff;color:#375dfb;font-weight:700}.actions{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid #eee}button{border:0;padding:12px 18px;border-radius:10px;font-weight:700}.primary{background:#375dfb;color:#fff}.secondary{background:#edf0f5}.hide{display:none}.notice{background:#fff6df;color:#895b08;padding:12px;border-radius:10px;margin-top:12px}.score{font-size:42px;font-weight:800;color:#375dfb}.section{border:1px solid #e5e9f0;border-radius:14px;padding:16px;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee;vertical-align:top}th{background:#f7f9fc}@media(max-width:650px){.grid,.opts{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:26px}}@media print{.hero,.steps,.actions,.noPrint{display:none}.card{box-shadow:none;padding:0}.wrap{max-width:none}}</style><body><div class="wrap"><div class="hero"><h1>AI增长执行官</h1><div>填写企业信息，自动生成可执行增长方案</div></div><div class="card"><div class="steps" id="steps"></div><div id="pages"><section><h2>1. 选择行业</h2><input type="hidden" id="industry"><div class="opts" id="opts"><div class="opt">房地产</div><div class="opt">美业门店</div><div class="opt">教培服务</div><div class="opt">餐饮门店</div><div class="opt">装修家居</div><div class="opt">企业服务</div></div></section><section class="hide"><h2>2. 企业资料</h2><div class="grid"><div><label>企业名称</label><input id="company"></div><div><label>所在城市</label><input id="city"></div><div><label>主营产品</label><input id="product"></div><div><label>平均客单价</label><input id="price" type="number"></div><div class="full"><label>核心卖点</label><textarea id="selling"></textarea></div><div class="full"><label>目标客户</label><textarea id="audience"></textarea></div><div class="full"><label>客户顾虑</label><textarea id="concerns"></textarea></div></div></section><section class="hide"><h2>3. 经营现状</h2><div class="grid"><div><label>月营业额</label><input id="revenue" type="number"></div><div><label>月营销预算</label><input id="budget" type="number"></div><div><label>每月线索数</label><input id="leads" type="number"></div><div><label>成交率%</label><input id="conversion" type="number"></div><div><label>每月视频数</label><input id="videos" type="number"></div><div><label>每月直播数</label><input id="lives" type="number"></div><div><label>销售人数</label><input id="sales" type="number"></div><div><label>运营人数</label><input id="ops" type="number"></div></div></section><section class="hide"><h2>4. 增长目标</h2><div class="grid"><div><label>首要目标</label><select id="goal"><option>增加有效线索</option><option>提升到店人数</option><option>提升营业额</option><option>提升直播成交</option><option>建立销售流程</option></select></div><div><label>周期</label><select id="period"><option value="30">30天</option><option value="60">60天</option><option value="90" selected>90天</option></select></div><div><label>目标线索数</label><input id="targetLeads" type="number"></div><div><label>目标月营业额</label><input id="targetRevenue" type="number"></div><div class="full"><label>优先解决的问题</label><textarea id="priority"></textarea></div></div><div class="notice hide" id="warn"></div></section><section class="hide"><h2>5. 执行资源</h2><div class="grid"><div><label>每周投入小时</label><input id="hours" type="number"></div><div><label>负责人配合度</label><select id="cooperation"><option>高</option><option selected>中</option><option>低</option></select></div><div class="full"><label>现有素材</label><textarea id="assets"></textarea></div></div></section><section class="hide" id="result"></section></div><div class="actions"><button class="secondary" id="prev">上一步</button><button class="primary" id="next">下一步</button></div></div></div><script>let p=0;const ps=[...document.querySelectorAll('#pages>section')],ss=['选行业','企业资料','经营现状','增长目标','执行资源','查看方案'];function E(i){return document.getElementById(i)}function V(i){return E(i).value.trim()}function N(i){return +E(i).value||0}function show(){ps.forEach((x,i)=>x.classList.toggle('hide',i!==p));E('steps').innerHTML=ss.map((x,i)=>`<span class="step ${i===p?'on':''}">${i+1}.${x}</span>`).join('');E('prev').style.visibility=p?'visible':'hidden';E('next').textContent=p===4?'生成方案':p===5?'重新填写':'下一步';}document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{document.querySelectorAll('.opt').forEach(y=>y.classList.remove('on'));x.classList.add('on');E('industry').value=x.textContent});E('prev').onclick=()=>{if(p>0)p--;show()};E('next').onclick=()=>{if(p===0&&!V('industry'))return alert('请选择行业');if(p===1&&!V('company'))return alert('请填写企业名称');if(p===3){let w=[];if(N('revenue')&&N('targetRevenue')>N('revenue')*2)w.push('目标营业额超过当前水平2倍');if(N('budget')<N('revenue')*.03&&N('targetRevenue')>N('revenue')*1.5)w.push('预算与目标存在差距');if(w.length){E('warn').innerHTML='目标校验：'+w.join('；');E('warn').classList.remove('hide')}}if(p===4){report();p=5;show();return}if(p===5){p=0;show();return}p++;show()};function report(){let score=88,issues=[];if(N('videos')<8){score-=12;issues.push('内容产能不足')}if(N('leads')<30){score-=12;issues.push('线索规模偏低')}if(N('leads')>=50&&N('conversion')<5){score-=14;issues.push('销售转化偏弱')}if(!N('lives')){score-=7;issues.push('直播渠道缺失')}if(!N('sales')){score-=12;issues.push('销售承接缺口')}if(!N('ops')){score-=8;issues.push('运营执行缺口')}score=Math.max(30,score);let t=N('targetLeads')||Math.max(N('leads')*2,100),m=Math.ceil(t/(N('period')/30)),w=Math.ceil(m/4.3);let topics=['客户最容易忽略的3件事','同类产品价格为什么差距大','真实服务流程公开','一个典型客户案例','行业常见错误认知','我们的关键细节','客户最关心的问题','购买前如何判断','产品适合哪些人','客户顾虑集中解答','团队工作实拍','本月咨询福利'];E('result').innerHTML=`<h2>${V('company')}｜增长执行方案</h2><div class="score">${score}分</div><button class="primary noPrint" onclick="print()">打印/导出PDF</button><div class="section"><h3>一、现状诊断</h3><p>当前主要问题：${issues.join('、')||'基础较完整，进入放大阶段'}。</p><p>优先围绕内容、获客、销售承接和复盘建立闭环。</p></div><div class="section"><h3>二、目标拆解</h3><p>${N('period')}天目标${t}条线索，月均${m}条，周均${w}条。</p></div><div class="section"><h3>三、客户与定位</h3><p><b>产品：</b>${V('product')||'待补充'}</p><p><b>客户：</b>${V('audience')||'待补充'}</p><p><b>卖点：</b>${V('selling')||'待补充'}</p><p><b>顾虑：</b>${V('concerns')||'待补充'}</p></div><div class="section"><h3>四、12条内容选题</h3><table><tr><th>日期</th><th>选题</th><th>形式</th></tr>${topics.map((x,i)=>`<tr><td>第${i+1}天</td><td>${x}</td><td>${i%3===0?'真人口播':i%3===1?'场景实拍':'案例拆解'}</td></tr>`).join('')}</table></div><div class="section"><h3>五、直播与销售</h3><p>每周1至2场直播，流程采用：开场留人→痛点→产品→案例→异议→留资。</p><p>线索当天联系，第2天发案例，第4天发方案，第7天电话跟进。</p></div><div class="section"><h3>六、30天行动</h3><p>1至7天：整理资料、定位账号、制作首批脚本。</p><p>8至14天：发布5条内容，完成首次直播。</p><p>15至21天：复盘数据，放大高表现内容。</p><p>22至30天：优化销售话术，形成下月计划。</p></div><div class="section"><h3>七、人员安排</h3><p>负责人负责目标和审核；运营负责内容与数据；销售负责线索跟进；AI负责选题、脚本和复盘初稿。</p></div>`}show();</script></body></html>
