version: '3.9'
services:
  api:
    build: ../apps/api-server
    env_file: ../apps/api-server/.env.example
    ports: ['3000:3000']
    depends_on: [mysql, redis]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: your_password
      MYSQL_DATABASE: fortune_app
  redis:
    image: redis:7
  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports: ['80:80', '443:443']
    depends_on: [api]
