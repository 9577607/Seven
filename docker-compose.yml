version: '3.9'
services:
  api:
    build: ./backend/api
    container_name: autocontent_api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - JWT_SECRET=autocontent_dev_secret
      - AI_SERVICE_URL=http://ai_service:8000
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/autocontent
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - ai_service

  ai_service:
    build: ./ai_service
    container_name: autocontent_ai_service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: autocontent_frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:3000
      - NEXT_PUBLIC_AI_BASE_URL=http://localhost:8000
    depends_on:
      - ai_service

  admin:
    build: ./admin
    container_name: autocontent_admin
    ports:
      - "3002:3002"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000
      - VITE_AI_BASE_URL=http://localhost:8000
    depends_on:
      - api
      - ai_service

  workflow_service:
    image: python:3.11-slim
    container_name: autocontent_workflow_service
    command: ["sh", "-c", "echo 'workflow service placeholder' && tail -f /dev/null"]
    depends_on:
      - rabbitmq
      - redis

  postgres:
    image: postgres:16
    container_name: autocontent_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=autocontent
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7
    container_name: autocontent_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: autocontent_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
