<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>企业智能增长系统</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#2348c9,#6f8cff);color:#fff;border-radius:22px;padding:28px 22px}.hero h1{margin:0 0 10px;font-size:28px}.hero p{margin:0;line-height:1.7;color:#edf1ff}.card{background:#fff;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 10px 30px rgba(31,54,110,.08)}.steps{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.step{white-space:nowrap;padding:8px 12px;border-radius:999px;background:#eef1f6;color:#667085;font-size:13px}.step.on{background:#375dfb;color:#fff}.page.hide{display:none}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{border:1px solid #dce2eb;border-radius:12px;padding:15px;text-align:center}.opt.on{border-color:#375dfb;background:#eef2ff;color:#375dfb;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px;font-size:14px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;font:inherit;background:#fff}textarea{min-height:82px}.actions{display:flex;justify-content:space-between;margin-top:20px;padding-top:16px;border-top:1px solid #eee}button{border:0;padding:12px 18px;border-radius:10px;font-weight:700}.primary{background:#375dfb;color:#fff}.secondary{background:#edf0f5}.score{font-size:44px;font-weight:800;color:#375dfb}.section{border:1px solid #e5e9f0;border-radius:14px;padding:16px;margin-top:14px}.section h3{margin-top:0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee;vertical-align:top}th{background:#f7f9fc}.tip{background:#fff6df;color:#8a5b08;padding:12px;border-radius:10px;margin-top:12px}.hide{display:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:25px}.wrap{padding:12px}.card{padding:16px}}@media print{.hero,.steps,.actions,.noPrint{display:none}.card{box-shadow:none;padding:0}.wrap{max-width:none}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>企业智能增长系统</h1><p>填写企业信息，自动生成诊断、内容、直播、销售和30天执行方案。</p></div>
<div class="card">
<div class="steps" id="steps"></div>
<section class="page"><h2>第一步：选择行业</h2><input type="hidden" id="industry"><div class="opts"><div class="opt">房地产</div><div class="opt">美业门店</div><div class="opt">教培服务</div><div class="opt">餐饮门店</div><div class="opt">装修家居</div><div class="opt">企业服务</div></div></section>
<section class="page hide"><h2>第二步：企业资料</h2><div class="grid"><div><label>企业名称</label><input id="company" placeholder="请输入企业名称"></div><div><label>所在城市</label><input id="city" placeholder="请输入城市"></div><div><label>主营产品</label><input id="product" placeholder="请输入主营产品"></div><div><label>平均客单价</label><input id="price" type="number" placeholder="元"></div><div class="full"><label>核心卖点</label><textarea id="selling" placeholder="填写3至5个卖点"></textarea></div><div class="full"><label>目标客户</label><textarea id="audience" placeholder="客户年龄、地区、预算、需求"></textarea></div><div class="full"><label>客户主要顾虑</label><textarea id="concerns" placeholder="价格、效果、信任、竞品比较等"></textarea></div></div></section>
<section class="page hide"><h2>第三步：经营现状</h2><div class="grid"><div><label>月营业额</label><input id="revenue" type="number"></div><div><label>月营销预算</label><input id="budget" type="number"></div><div><label>每月有效线索</label><input id="leads" type="number"></div><div><label>成交率（%）</label><input id="conversion" type="number"></div><div><label>每月短视频数量</label><input id="videos" type="number"></div><div><label>每月直播场次</label><input id="lives" type="number"></div><div><label>销售人数</label><input id="sales" type="number"></div><div><label>运营人数</label><input id="ops" type="number"></div></div></section>
<section class="page hide"><h2>第四步：增长目标</h2><div class="grid"><div><label>首要目标</label><select id="goal"><option>增加有效线索</option><option>提升到店人数</option><option>提升营业额</option><option>提升直播成交</option><option>建立销售流程</option></select></div><div><label>执行周期</label><select id="period"><option value="30">30天</option><option value="60">60天</option><option value="90" selected>90天</option></select></div><div><label>目标线索数</label><input id="targetLeads" type="number"></div><div><label>目标月营业额</label><input id="targetRevenue" type="number"></div><div class="full"><label>优先解决的问题</label><textarea id="priority"></textarea></div></div><div id="warn" class="tip hide"></div></section>
<section class="page hide"><h2>第五步：执行资源</h2><div class="grid"><div><label>每周可投入时间（小时）</label><input id="hours" type="number"></div><div><label>负责人配合程度</label><select id="cooperation"><option>高</option><option selected>中</option><option>低</option></select></div><div class="full"><label>现有素材</label><textarea id="assets" placeholder="产品手册、客户案例、实景照片、历史视频等"></textarea></div></div></section>
<section class="page hide" id="result"></section>
<div class="actions"><button class="secondary" id="prev">上一步</button><button class="primary" id="next">下一步</button></div>
</div>
</div>
<script>
let p=0;const pages=[...document.querySelectorAll('.page')],names=['选行业','企业资料','经营现状','增长目标','执行资源','查看方案'];const E=id=>document.getElementById(id),V=id=>E(id).value.trim(),N=id=>Number(E(id).value||0);
function show(){pages.forEach((x,i)=>x.classList.toggle('hide',i!==p));E('steps').innerHTML=names.map((x,i)=>`<span class="step ${i===p?'on':''}">${i+1}.${x}</span>`).join('');E('prev').style.visibility=p?'visible':'hidden';E('next').textContent=p===4?'生成方案':p===5?'重新填写':'下一步'}
document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{document.querySelectorAll('.opt').forEach(y=>y.classList.remove('on'));x.classList.add('on');E('industry').value=x.textContent});
E('prev').onclick=()=>{if(p>0)p--;show()};
E('next').onclick=()=>{if(p===0&&!V('industry'))return alert('请选择行业');if(p===1&&!V('company'))return alert('请填写企业名称');if(p===3){let w=[];if(N('revenue')&&N('targetRevenue')>N('revenue')*2)w.push('目标营业额超过当前水平2倍');if(N('revenue')&&N('budget')<N('revenue')*.03&&N('targetRevenue')>N('revenue')*1.5)w.push('预算与目标存在差距');if(w.length){E('warn').textContent='目标校验：'+w.join('；');E('warn').classList.remove('hide')}}if(p===4){makeReport();p=5;show();return}if(p===5){p=0;show();return}p++;show()};
function makeReport(){let score=88,issues=[];if(N('videos')<8){score-=12;issues.push('内容产能不足')}if(N('leads')<30){score-=12;issues.push('线索规模偏低')}if(N('leads')>=50&&N('conversion')<5){score-=14;issues.push('销售转化偏弱')}if(!N('lives')){score-=7;issues.push('直播渠道缺失')}if(!N('sales')){score-=12;issues.push('销售承接缺口')}if(!N('ops')){score-=8;issues.push('运营执行缺口')}score=Math.max(30,score);let t=N('targetLeads')||Math.max(N('leads')*2,100),months=N('period')/30,m=Math.ceil(t/months),w=Math.ceil(m/4.3);let topics=['客户最容易忽略的3件事','同类产品价格为什么差距大','真实服务流程公开','一个典型客户案例','行业常见错误认知','我们的关键细节','客户最关心的问题','购买前如何判断','产品适合哪些人','客户顾虑集中解答','团队工作实拍','本月咨询福利'];E('result').innerHTML=`<h2>${V('company')}｜增长执行方案</h2><div class="score">${score}分</div><button class="primary noPrint" onclick="window.print()">打印或导出PDF</button><div class="section"><h3>一、现状诊断</h3><p>当前主要问题：${issues.join('、')||'基础较完整，可以进入增长放大阶段'}。</p><p>建议优先建立内容生产、获客、销售承接和数据复盘闭环。</p></div><div class="section"><h3>二、目标拆解</h3><p>${N('period')}天目标${t}条线索，月均${m}条，周均${w}条。</p></div><div class="section"><h3>三、企业定位</h3><p><b>行业：</b>${V('industry')}</p><p><b>产品：</b>${V('product')||'待补充'}</p><p><b>客户：</b>${V('audience')||'待补充'}</p><p><b>卖点：</b>${V('selling')||'待补充'}</p><p><b>顾虑：</b>${V('concerns')||'待补充'}</p></div><div class="section"><h3>四、12条内容选题</h3><table><tr><th>日期</th><th>选题</th><th>形式</th></tr>${topics.map((x,i)=>`<tr><td>第${i+1}天</td><td>${x}</td><td>${i%3===0?'真人口播':i%3===1?'场景实拍':'案例拆解'}</td></tr>`).join('')}</table></div><div class="section"><h3>五、直播与销售</h3><p>每周安排1至2场直播，流程为：开场留人 → 痛点 → 产品 → 案例 → 异议 → 留资。</p><p>线索当天联系，第2天发送案例，第4天发送方案，第7天电话跟进。</p></div><div class="section"><h3>六、30天行动</h3><p>1至7天：整理资料、明确定位、制作首批脚本。</p><p>8至14天：发布5条内容，完成首次直播。</p><p>15至21天：复盘数据，放大高表现内容。</p><p>22至30天：优化销售话术，形成下月计划。</p></div><div class="section"><h3>七、人员分工</h3><p>负责人负责目标与审核；运营负责内容与数据；销售负责线索跟进；AI负责选题、脚本和复盘初稿。</p></div>`}
show();
</script>
</body>
</html>
